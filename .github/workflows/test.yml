name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Smoke import
        run: python -c "import toffoli_optimizer; print(toffoli_optimizer.__version__)"

      - name: Verify required files exist
        run: |
          test -f LICENSE
          test -f CITATION.cff
          test -f README.md
          test -f pyproject.toml
          test -d experiments

      - name: Run pytest
        run: pytest -q
